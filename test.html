<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PesaPlanner Hub - Backwards Striped Bars</title>
    <style>
        /* Base App Styling */
        body {
            background-color: #0d1b2a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            background-color: #1b263b;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 24px;
        }

        .header h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
        }

        .header span {
            font-size: 12px;
            color: #8892b0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Category Row */
        .category-row {
            margin-bottom: 24px;
        }

        .cat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 15px;
        }

        .cat-name {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .cat-amount {
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        /* Progress Bar Track (The groove) */
        .progress-track {
            width: 100%;
            height: 16px;
            background-color: #0d1b2a;
            border-radius: 50px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.8), inset 0 -1px 2px rgba(255,255,255,0.05);
            overflow: hidden; /* Keeps the fill inside the track */
            position: relative;
        }

        /* Progress Bar Fill (The colored part) */
        .progress-fill {
            height: 100%;
            border-radius: 50px;
            position: relative;
            overflow: hidden; /* THE FIX: Keeps the stripes from leaking outside the fill */
            animation: fillBar 2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            transform: translateZ(0); /* GPU acceleration */
        }

        /* THE STRIPES: Hardware Accelerated Translation */
        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0; 
            bottom: 0;
            width: 200%; 
            left: -100%; 
            background: repeating-linear-gradient(
                45deg,
                rgba(0, 0, 0, 0.25), 
                rgba(0, 0, 0, 0.25) 15px,
                transparent 15px,
                transparent 30px
            );
            will-change: transform;
            animation: moveStripes 1.5s linear infinite;
        }

        /* Keyframe: Fills the bar from 0% to target width */
        @keyframes fillBar {
            from { width: 0; }
            to { width: var(--target-width); }
        }

        /* Keyframe: Slides the stripes backwards (Left) using transform */
        @keyframes moveStripes {
            0% { transform: translateX(0); }
            /* THE FIX: Negative value moves the stripes to the left (backwards) */
            100% { transform: translateX(-42.42px); } 
        }

        /* Category Footer (Percentage + Remaining) */
        .cat-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
            font-size: 12px;
            color: #8892b0;
        }

        .percentage {
            font-weight: 600;
            color: #e0e1dd;
        }

        /* --- COLOR THEMES & GLOWS --- */
        
        /* 1. Other (Yellow/Gold) */
        .fill-other {
            --target-width: 60%;
            background: linear-gradient(90deg, #FFD700, #FFA500);
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.4);
        }
        .fill-other .percentage { color: #FFD700; }

        /* 2. Savings (Green) */
        .fill-savings {
            --target-width: 82%;
            background: linear-gradient(90deg, #00E676, #00C853);
            box-shadow: 0 0 12px rgba(0, 230, 118, 0.4);
        }
        .fill-savings .percentage { color: #00E676; }

        /* 3. Transport (Blue/Teal) */
        .fill-transport {
            --target-width: 45%;
            background: linear-gradient(90deg, #00B4D8, #0077B6);
            box-shadow: 0 0 12px rgba(0, 180, 216, 0.4);
        }
        .fill-transport .percentage { color: #00B4D8; }

        /* 4. Salary (Purple) */
        .fill-salary {
            --target-width: 25%;
            background: linear-gradient(90deg, #B388FF, #7C4DFF);
            box-shadow: 0 0 12px rgba(179, 136, 255, 0.4);
        }
        .fill-salary .percentage { color: #B388FF; }

    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <h2>By category</h2>
            <span>This Month</span>
        </div>

        <!-- Category 1: Other -->
        <div class="category-row">
            <div class="cat-header">
                <div class="cat-name"><span>📊</span> Other</div>
                <div class="cat-amount">KSh 57,938</div>
            </div>
            <div class="progress-track">
                <div class="progress-fill fill-other"></div>
            </div>
            <div class="cat-footer">
                <span class="percentage">60%</span>
                <span>KSh 42,062 left</span>
            </div>
        </div>

        <!-- Category 2: Savings -->
        <div class="category-row">
            <div class="cat-header">
                <div class="cat-name"><span>🐖</span> Savings</div>
                <div class="cat-amount">KSh 48,004</div>
            </div>
            <div class="progress-track">
                <div class="progress-fill fill-savings"></div>
            </div>
            <div class="cat-footer">
                <span class="percentage">82%</span>
                <span>KSh 10,996 left</span>
            </div>
        </div>

        <!-- Category 3: Transport -->
        <div class="category-row">
            <div class="cat-header">
                <div class="cat-name"><span>🚌</span> Transport</div>
                <div class="cat-amount">KSh 33,377</div>
            </div>
            <div class="progress-track">
                <div class="progress-fill fill-transport"></div>
            </div>
            <div class="cat-footer">
                <span class="percentage">45%</span>
                <span>KSh 40,623 left</span>
            </div>
        </div>

        <!-- Category 4: Salary -->
        <div class="category-row">
            <div class="cat-header">
                <div class="cat-name"><span>💰</span> Salary</div>
                <div class="cat-amount">KSh 12,710</div>
            </div>
            <div class="progress-track">
                <div class="progress-fill fill-salary"></div>
            </div>
            <div class="cat-footer">
                <span class="percentage">25%</span>
                <span>KSh 38,130 left</span>
            </div>
        </div>

    </div>

</body>
</html>
